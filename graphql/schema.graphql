# GraphQL Schema for CMS - Complete API
# This schema matches the actual implementation in internal/graphql/

scalar Time
scalar JSON

enum WorkflowStatus {
  DRAFT
  IN_REVIEW
  READY_FOR_APPROVAL
  APPROVED
  PUBLISHED
  REJECTED
}

enum UserStatus {
  ACTIVE
  INACTIVE
  SUSPENDED
}

enum ProjectRole {
  PROJECT_OWNER
  PROJECT_ADMIN
  PROJECT_EDITOR
  PROJECT_VIEWER
}

# ==========================================
# AUTHENTICATION & USER MANAGEMENT
# ==========================================

type User {
  id: ID!
  name: String!
  email: String!
  provider: String!
  status: UserStatus!
  roleId: Int!
  role: Role
  profile: String
  createdAt: Time!
  updatedAt: Time!
}

type Role {
  id: ID!
  name: String!
  description: String
  permissions: [Permission!]!
  createdAt: Time!
  updatedAt: Time!
}

type Permission {
  id: ID!
  roleId: Int!
  module: String!
  action: String!
  fieldScope: String
  allowedFields: JSON
  deniedFields: JSON
  contentTypeIds: JSON
  createdAt: Time!
  updatedAt: Time!
}

type AuthPayload {
  token: String!
  refreshToken: String!
  user: User!
}

# ==========================================
# PROJECT MANAGEMENT
# ==========================================

type Project {
  id: ID!
  name: String!
  description: String
  createdBy: Int!
  creator: User
  members: [ProjectMember!]!
  contentTypes: [ContentType!]!
  createdAt: Time!
  updatedAt: Time!
}

type ProjectMember {
  id: ID!
  projectId: Int!
  project: Project
  userId: Int!
  user: User
  role: String!
  roleId: Int
  roleDetail: Role
  invitedBy: Int
  inviter: User
  status: String!
  createdAt: Time!
  updatedAt: Time!
}

# ==========================================
# CONTENT MANAGEMENT
# ==========================================

type ContentType {
  id: ID!
  name: String!
  slug: String!
  projectId: Int
  project: Project
  enableSeo: Boolean!
  fields: [ContentField!]!
  seoFields: [ContentField!]!
  createdAt: Time!
  updatedAt: Time!
}

type ContentField {
  id: ID!
  contentTypeId: Int!
  name: String!
  type: String!
  required: Boolean!
  isSeo: Boolean!
  unique: Boolean!
  maxLength: Int
  minLength: Int
  pattern: String
  minValue: Float
  maxValue: Float
  defaultValue: String
  placeholder: String
  helpText: String
  createdAt: Time!
  updatedAt: Time!
}

type ContentEntry {
  id: ID!
  contentTypeId: Int!
  contentType: ContentType
  projectId: Int
  project: Project
  data: JSON!
  status: WorkflowStatus!
  createdBy: Int
  updatedBy: Int
  creator: User
  updater: User
  createdAt: Time!
  updatedAt: Time!
  publishedAt: Time
}

type ContentRelation {
  id: ID!
  fromContentId: Int!
  toContentId: Int!
  relationType: String!
  createdAt: Time!
  updatedAt: Time!
}

# ==========================================
# MEDIA MANAGEMENT
# ==========================================

type MediaFile {
  id: ID!
  fileName: String!
  url: String!
  type: String!
  size: Int!
  width: Int
  height: Int
  folder: String!
  tags: JSON
  alt: String!
  caption: String
  uploadedBy: Int!
  uploader: User
  createdAt: Time!
  updatedAt: Time!
}

type MediaFolder {
  id: ID!
  name: String!
  path: String!
  parentId: Int
  createdBy: Int!
  createdAt: Time!
  updatedAt: Time!
}

type MediaStats {
  totalFiles: Int!
  totalSize: Int!
  byType: JSON
  recentUploads: Int!
  storageMode: String
}

# ==========================================
# WORKFLOW MANAGEMENT
# ==========================================

type WorkflowHistory {
  id: ID!
  entryId: Int!
  entry: ContentEntry
  fromStatus: WorkflowStatus!
  toStatus: WorkflowStatus!
  changedBy: Int!
  user: User
  comment: String
  createdAt: Time!
  updatedAt: Time!
}

type WorkflowComment {
  id: ID!
  entryId: Int!
  entry: ContentEntry
  userId: Int!
  user: User
  comment: String!
  isPrivate: Boolean!
  createdAt: Time!
  updatedAt: Time!
}

type WorkflowAssignment {
  id: ID!
  entryId: Int!
  entry: ContentEntry
  assignedTo: Int!
  user: User
  assignedBy: Int!
  assigner: User
  status: String!
  dueDate: Time
  createdAt: Time!
  updatedAt: Time!
}

type WorkflowStats {
  total: Int!
  draft: Int!
  in_review: Int!
  ready_for_approval: Int!
  approved: Int!
  published: Int!
  rejected: Int!
}

# ==========================================
# SEARCH & FILTERING
# ==========================================

type SearchResult {
  entries: [ContentEntry!]!
  total: Int!
  page: Int!
  limit: Int!
  totalPages: Int!
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  query: String
}

# ==========================================
# QUERIES
# ==========================================

type Query {
  # Authentication
  me: User
  
  # User Management
  users(limit: Int, offset: Int): [User!]!
  user(id: ID!): User
  
  # Role Management
  roles: [Role!]!
  role(id: ID!): Role
  
  # Project Management
  projects: [Project!]!
  project(id: ID!): Project
  projectMembers(projectId: ID!): [ProjectMember!]!
  
  # Content Management
  contentTypes: [ContentType!]!
  contentType(id: ID!): ContentType
  contentEntries(contentTypeId: Int!, limit: Int, offset: Int): [ContentEntry!]!
  contentEntry(id: ID!): ContentEntry
  contentRelations(fromContentId: Int!): [ContentRelation!]!
  
  # Media Management
  mediaFiles(limit: Int, offset: Int, folder: String): [MediaFile!]!
  mediaFile(id: ID!): MediaFile
  mediaFolders: [MediaFolder!]!
  mediaStats: MediaStats!
  
  # Workflow Management
  workflowHistory(entryId: Int!): [WorkflowHistory!]!
  workflowComments(entryId: Int!, includePrivate: Boolean): [WorkflowComment!]!
  workflowAssignments(status: String): [WorkflowAssignment!]!
  workflowStats(contentTypeId: Int!): WorkflowStats!
  
  # Search & Filtering
  searchEntries(
    query: String
    contentTypeIds: [Int!]
    fields: [String!]
    status: String
    createdBy: Int
    tags: [String!]
    fromDate: String
    toDate: String
    page: Int
    limit: Int
    sortBy: String
    orderBy: String
  ): SearchResult!
  
  advancedSearch(
    query: String
    contentTypeIds: [Int!]
    fields: [String!]
    status: String
    createdBy: Int
    tags: [String!]
    fromDate: String
    toDate: String
    filters: JSON
    page: Int
    limit: Int
    sortBy: String
    orderBy: String
  ): SearchResult!
  
  searchFacets(query: String, contentTypeIds: [Int!]): JSON!
  
  autocomplete(field: String!, prefix: String!, contentTypeId: Int!, limit: Int): [String!]!
  
  # SEO
  seoPreview(entryId: Int!): JSON!
}

# ==========================================
# MUTATIONS
# ==========================================

type Mutation {
  # Authentication (Public)
  login(email: String!, password: String!): AuthPayload!
  register(name: String!, email: String!, password: String!): AuthPayload!
  
  # User Management (Admin only)
  createUser(name: String!, email: String!, password: String!, roleId: Int!): User!
  updateUser(
    id: ID!
    name: String
    email: String
    password: String
    roleId: Int
    status: UserStatus
  ): User!
  deleteUser(id: ID!): Boolean!
  
  # Role Management (Admin only)
  createRole(name: String!, description: String): Role!
  updateRole(id: ID!, name: String, description: String): Role!
  deleteRole(id: ID!): Boolean!
  duplicateRole(id: ID!, name: String): Role!
  assignRoleToUser(userId: ID!, roleId: ID!): Boolean!
  
  # Project Management
  createProject(name: String!, description: String): Project!
  updateProject(id: ID!, name: String!, description: String): Project!
  deleteProject(id: ID!): Boolean!
  addProjectMember(projectId: ID!, userId: ID!, role: String!): ProjectMember!
  updateProjectMemberRole(projectId: ID!, memberId: ID!, role: String!): ProjectMember!
  removeProjectMember(projectId: ID!, memberId: ID!): Boolean!
  
  # Content Types
  createContentType(name: String!, slug: String!, enableSeo: Boolean, projectId: Int): ContentType!
  updateContentType(id: ID!, name: String, slug: String, enableSeo: Boolean): ContentType!
  deleteContentType(id: ID!): Boolean!
  
  # Content Fields
  addContentField(
    contentTypeId: Int!
    name: String!
    type: String!
    required: Boolean
    isSeo: Boolean
    unique: Boolean
    maxLength: Int
    minLength: Int
    pattern: String
    minValue: Float
    maxValue: Float
    defaultValue: String
    placeholder: String
    helpText: String
  ): ContentField!
  
  updateContentField(
    id: ID!
    name: String
    type: String
    required: Boolean
    isSeo: Boolean
    unique: Boolean
    maxLength: Int
    minLength: Int
    pattern: String
    minValue: Float
    maxValue: Float
    defaultValue: String
    placeholder: String
    helpText: String
  ): ContentField!
  
  deleteContentField(id: ID!): Boolean!
  
  # Content Entries
  createContentEntry(contentTypeId: ID!, data: JSON!): ContentEntry!
  updateContentEntry(id: ID!, data: JSON, status: WorkflowStatus): ContentEntry!
  deleteContentEntry(id: ID!): Boolean!
  translateContentEntry(
    id: ID!
    targetLang: String!
    sourceLang: String
    fields: [String!]
  ): ContentEntry!
  
  # Content Relations
  createContentRelation(
    fromContentId: ID!
    toContentId: Int!
    relationType: String!
  ): ContentRelation!
  deleteContentRelation(id: ID!): Boolean!
  
  # Media
  createMediaFolder(name: String!, parentId: Int): MediaFolder!
  
  # Workflow
  changeContentStatus(
    entryId: Int!
    status: WorkflowStatus!
    comment: String
  ): WorkflowHistory!
  
  requestReview(entryId: Int!, comment: String): WorkflowHistory!
  approveEntry(entryId: Int!, comment: String): WorkflowHistory!
  rejectEntry(entryId: Int!, comment: String!): WorkflowHistory!
  publishEntry(entryId: Int!, comment: String): WorkflowHistory!
  
  addWorkflowComment(entryId: Int!, comment: String!, isPrivate: Boolean): WorkflowComment!
  
  assignEntry(entryId: Int!, assignedTo: Int!, dueDate: Time): WorkflowAssignment!
}