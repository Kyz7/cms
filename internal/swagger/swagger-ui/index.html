<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CMS API Documentation</title>
    <base href="/swagger/">
    <link rel="stylesheet" type="text/css" href="/swagger/swagger-ui.css" />
    <link rel="icon" type="image/png" href="/swagger/favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="/swagger/favicon-16x16.png" sizes="16x16" />
    <style>
        html {
            box-sizing: border-box;
            overflow: -moz-scrollbars-vertical;
            overflow-y: scroll;
        }
        *, *:before, *:after {
            box-sizing: inherit;
        }
        body {
            margin:0;
            background: #fafafa;
        }
    </style>
</head>
<body>
    <div id="swagger-ui"></div>
    <script src="/swagger/swagger-ui-bundle.js"></script>
    <script src="/swagger/swagger-ui-standalone-preset.js"></script>
    <script>
        window.onload = function() {
            const ui = SwaggerUIBundle({
                url: '{{OPENAPI_URL}}',
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                plugins: [
                    SwaggerUIBundle.plugins.DownloadUrl
                ],
                layout: "StandaloneLayout",
                validatorUrl: null,
                tryItOutEnabled: true,
                requestInterceptor: function(request) {
                    // Add authorization header if available
                    const token = localStorage.getItem('access_token');
                    if (token) {
                        request.headers.Authorization = 'Bearer ' + token;
                    }
                    return request;
                },
                onComplete: function() {
                    // Add login/logout functionality
                    const authButton = document.createElement('div');
                    authButton.innerHTML = `
                        <div style="position: fixed; top: 10px; right: 10px; z-index: 1000;">
                            <input type="text" id="token-input" placeholder="Enter JWT token" style="padding: 5px; margin-right: 5px;">
                            <button onclick="setToken()" style="padding: 5px 10px;">Set Token</button>
                            <button onclick="clearToken()" style="padding: 5px 10px;">Clear Token</button>
                        </div>
                    `;
                    document.body.appendChild(authButton);
                }
            });
            
            window.ui = ui;
        };
        
        function setToken() {
            const token = document.getElementById('token-input').value;
            if (token) {
                localStorage.setItem('access_token', token);
                // Reload the page to apply the token
                window.location.reload();
            }
        }
        
        function clearToken() {
            localStorage.removeItem('access_token');
            document.getElementById('token-input').value = '';
            // Reload the page to clear the token
            window.location.reload();
        }
    </script>
</body>
</html>
